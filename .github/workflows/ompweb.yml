name: ompweb integration build

# Dispatched by `integration build` (CI_REPO/CI_WORKFLOW in config/root--git--ompweb.sh) with the
# integration head to build. Build and test commands come from that config.
on:
   workflow_dispatch:
      inputs:
         repo:
            description: Fork holding the commit (owner/repo)
            required: true
            type: string
         sha:
            description: Integration commit to build (full sha)
            required: true
            type: string

run-name: build ${{ inputs.sha }}

# The build job runs the fork's code, including carried PRs, so it gets a
# read-only token that is not persisted into the checkouts; only the publish
# job, which runs no fork code, can write releases.
permissions: {}

jobs:
   build:
      runs-on: ubuntu-24.04
      timeout-minutes: 40
      permissions:
         contents: read
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
           with:
              repository: ${{ inputs.repo }}
              ref: ${{ inputs.sha }}
              persist-credentials: false
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
           with:
              path: ci
              persist-credentials: false
         - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
           with:
              node-version: "26.8.1"
         - name: Build, test and pack
           shell: bash
           env:
              OUT: ${{ runner.temp }}/out
           run: |
              set -euo pipefail
              mkdir -p "$OUT"
              source ci/config/root--git--ompweb.sh
              eval "$BUILD_CMD"
              if [ -n "${TEST_CMD:-}" ]; then eval "$TEST_CMD"; fi
              npm pack --ignore-scripts --silent --pack-destination "$OUT"
              cp package-lock.json "$OUT/"
         - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
           with:
              name: ompweb
              path: ${{ runner.temp }}/out
              retention-days: 7
              if-no-files-found: error
         # Standalone binaries (no Node or npm needed): Bun cross-compiles each target from the client
         # built above, into release/ompweb-<target>/ (the binary plus the files it serves). x64 uses the
         # -baseline runtime (no AVX2 needed); the directory keeps the plain name.
         - name: Build the binaries
           shell: bash
           run: |
              set -euo pipefail
              for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
                bun_target="bun-$target"
                case "$target" in *-x64) bun_target="$bun_target-baseline" ;; esac
                npx bun scripts/build-binary.ts --target "$bun_target"
              done
              npm run smoke -- --binary release/ompweb-linux-x64/ompweb
         - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
           with:
              name: bin-ompweb-linux-x64
              path: release/ompweb-linux-x64
              retention-days: 7
              if-no-files-found: error
         - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
           with:
              name: bin-ompweb-linux-arm64
              path: release/ompweb-linux-arm64
              retention-days: 7
              if-no-files-found: error
         - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
           with:
              name: bin-ompweb-darwin-x64
              path: release/ompweb-darwin-x64
              retention-days: 7
              if-no-files-found: error
         - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
           with:
              name: bin-ompweb-darwin-arm64
              path: release/ompweb-darwin-arm64
              retention-days: 7
              if-no-files-found: error
         - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
           with:
              name: bin-ompweb-windows-x64
              path: release/ompweb-windows-x64
              retention-days: 7
              if-no-files-found: error
   publish:
      needs: build
      permissions:
         contents: write
      uses: ./.github/workflows/publish.yml
      with:
         repo: ${{ inputs.repo }}
         sha: ${{ inputs.sha }}
         project: ompweb
         artifact: ompweb
         description: npm pack of @kahme247/ompweb (built with node 26.8.1) plus the package-lock.json it was built with.
   # The npm-package publish above must stay the first `project:`/`artifact:` pair: `integration
   # build` reads those to fetch the deployable zip. Runs after it so the two never race to create
   # the release.
   publish-binaries:
      needs: publish
      permissions:
         contents: write
      uses: ./.github/workflows/publish.yml
      with:
         repo: ${{ inputs.repo }}
         sha: ${{ inputs.sha }}
         project: ompweb
         artifact: bin-ompweb
         targets: linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64
         executables: ompweb
         description: "Standalone ompweb binary for {target}: unzip and run ./ompweb (ompweb.exe on Windows) for the web UI, ./ompweb host for the session daemon. Keep the files next to it; no Node or npm needed."
