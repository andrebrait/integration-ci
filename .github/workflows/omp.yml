name: omp integration build

# Dispatched by `integration build` (CI_REPO/CI_WORKFLOW in config/root--git--oh-my-pi.sh)
# with the integration head to build. The fork carries no workflow of its own: PR
# branches and the integration branch are rebuilt from upstream every round.
on:
   workflow_dispatch:
      inputs:
         repo:
            description: Fork holding the commit (owner/repo)
            required: true
            type: string
         sha:
            description: Integration commit to build (full sha)
            required: true
            type: string

run-name: build ${{ inputs.sha }}

permissions:
   contents: write # releases
   actions: write

jobs:
   build:
      runs-on: ubuntu-24.04
      timeout-minutes: 90
      steps:
         - uses: actions/checkout@v4
           with:
              repository: ${{ inputs.repo }}
              ref: ${{ inputs.sha }}
         - uses: actions/checkout@v4
           with:
              path: ci
         - uses: ./.github/actions/bun-install
         - id: bazel
           uses: ./.github/actions/bazel-cache
           with:
              scope: linux
         - name: Build and test
           shell: bash
           env:
              OMP_BAZEL_RC: ${{ steps.bazel.outputs.rc }}
              # The host build defaults to cargo, which ignores the bazel disk cache.
              OMP_NATIVE_BUILD_BACKEND: bazel
           run: |
              set -euo pipefail
              # Same file-descriptor floor upstream's bazel steps set.
              if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
              source ci/config/root--git--oh-my-pi.sh
              eval "$BUILD_CMD"
              eval "$TEST_CMD"
         # Saved even when tests fail: the native build is the expensive part.
         - name: Save bazel disk cache
           if: always() && steps.bazel.outputs.save-needed == 'true'
           continue-on-error: true
           uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              # Must mirror the restore path list in the fork's bazel-cache action.
              path: |
                 ~/.cache/omp-bazel-disk
                 ~/.cache/omp-bazel-repo
              key: ${{ steps.bazel.outputs.cache-key }}
         - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: omp
              path: packages/coding-agent/dist/omp
              retention-days: 7
              if-no-files-found: error
         # Public, login-free downloads: one release per green build plus a
         # rolling omp-latest, pruned to the newest 10 per-build releases.
         # Every project here uses its own <project>-* tags; none claims the
         # repo-wide "Latest" flag, which only one release can hold.
         - name: Publish release
           shell: bash
           env:
              GH_TOKEN: ${{ github.token }}
              GH_REPO: ${{ github.repository }}
              FORK: ${{ inputs.repo }}
              SHA: ${{ inputs.sha }}
           run: |
              set -euo pipefail
              out="$RUNNER_TEMP/release"
              mkdir -p "$out"
              cp packages/coding-agent/dist/omp "$out/omp"
              (cd "$out" && sha256sum omp > omp.sha256)
              # The integration branch is the upstream base plus `PR #N:` squashes,
              # newest first; the first other commit is the base.
              gh api "repos/$FORK/commits?sha=$SHA&per_page=100" --jq '.[] | [.sha, (.commit.message | split("\n")[0])] | @tsv' > "$out/log.tsv"
              {
                echo "omp integration build of [$FORK@${SHA:0:10}](https://github.com/$FORK/commit/$SHA)."
                echo
                echo "Linux x64 (glibc) binary. Verify with \`sha256sum -c omp.sha256\`."
                echo
                echo "Upstream base: $(awk -F'\t' '$2 !~ /^PR #[0-9]+: / { print substr($1, 1, 10) " " $2; exit }' "$out/log.tsv")"
                echo
                echo "Carried pull requests:"
                awk -F'\t' '$2 !~ /^PR #[0-9]+: / { exit } { print "- " $2 }' "$out/log.tsv" | tac
              } > "$out/RELEASE.md"
              tag="omp-${SHA:0:10}"
              gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
              gh release create "$tag" --target "$GITHUB_SHA" --title "omp ${SHA:0:10}" --notes-file "$out/RELEASE.md" --latest=false \
                "$out/omp" "$out/omp.sha256" "$out/RELEASE.md"
              gh release delete omp-latest --cleanup-tag --yes 2>/dev/null || true
              gh release create omp-latest --target "$GITHUB_SHA" --title "omp latest (${SHA:0:10})" --notes-file "$out/RELEASE.md" --latest=false \
                "$out/omp" "$out/omp.sha256" "$out/RELEASE.md"
              gh release list --limit 100 --json tagName,createdAt \
                --jq '[.[] | select(.tagName | test("^omp-[0-9a-f]{10}$"))] | sort_by(.createdAt) | reverse | .[10:][].tagName' |
                while read -r old; do gh release delete "$old" --cleanup-tag --yes; done
