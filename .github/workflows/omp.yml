name: omp integration build

# Dispatched by `integration build` (CI_REPO/CI_WORKFLOW in config/root--git--oh-my-pi.sh)
# with the integration head to build. The fork carries no workflow of its own: PR
# branches and the integration branch are rebuilt from upstream every round.
on:
   workflow_dispatch:
      inputs:
         repo:
            description: Fork holding the commit (owner/repo)
            required: true
            type: string
         sha:
            description: Integration commit to build (full sha)
            required: true
            type: string

run-name: build ${{ inputs.sha }}

# The build job runs the fork's code, including carried third-party PRs, so it
# gets no write access to this repository's contents; only `publish`, which
# never runs fork code, can write releases.
permissions: {}

jobs:
   build:
      runs-on: ubuntu-24.04
      timeout-minutes: 90
      permissions:
         contents: read
         actions: write # bazel/bun cache saves
      steps:
         - uses: actions/checkout@v4
           with:
              repository: ${{ inputs.repo }}
              ref: ${{ inputs.sha }}
         - uses: actions/checkout@v4
           with:
              path: ci
         - uses: ./.github/actions/bun-install
         - id: bazel
           uses: ./.github/actions/bazel-cache
           with:
              scope: linux
         - name: Build and test
           shell: bash
           env:
              OMP_BAZEL_RC: ${{ steps.bazel.outputs.rc }}
              # The host build defaults to cargo, which ignores the bazel disk cache.
              OMP_NATIVE_BUILD_BACKEND: bazel
           run: |
              set -euo pipefail
              # Same file-descriptor floor upstream's bazel steps set.
              if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
              source ci/config/root--git--oh-my-pi.sh
              eval "$BUILD_CMD"
              eval "$TEST_CMD"
         # Saved even when tests fail: the native build is the expensive part.
         - name: Save bazel disk cache
           if: always() && steps.bazel.outputs.save-needed == 'true'
           continue-on-error: true
           uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              # Must mirror the restore path list in the fork's bazel-cache action.
              path: |
                 ~/.cache/omp-bazel-disk
                 ~/.cache/omp-bazel-repo
              key: ${{ steps.bazel.outputs.cache-key }}
         - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: omp
              path: packages/coding-agent/dist/omp
              retention-days: 7
              if-no-files-found: error
   # Public, login-free downloads. Each project owns one release named
   # after it; every green build adds <project>-<UTC stamp>-<sha10>.zip
   # and only the newest 10 assets are kept. No release claims the
   # repo-wide "Latest" flag.
   publish:
      needs: build
      runs-on: ubuntu-24.04
      permissions:
         contents: write
      steps:
         - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              name: omp
              path: ${{ runner.temp }}/release
         - name: Publish build
           shell: bash
           env:
              GH_TOKEN: ${{ github.token }}
              GH_REPO: ${{ github.repository }}
              FORK: ${{ inputs.repo }}
              SHA: ${{ inputs.sha }}
              PROJECT: oh-my-pi
           run: |
              set -euo pipefail
              out="$RUNNER_TEMP/release"
              chmod +x "$out/omp"
              # The integration branch is the upstream base plus `PR #N:` squashes,
              # newest first; the first other commit is the base.
              gh api "repos/$FORK/commits?sha=$SHA&per_page=100" --jq '.[] | [.sha, (.commit.message | split("\n")[0])] | @tsv' > "$out/log.tsv"
              {
                echo "omp integration build of $FORK@$SHA (https://github.com/$FORK/commit/$SHA)."
                echo "Linux x64 (glibc) binary."
                echo
                echo "Upstream base: $(awk -F'\t' '$2 !~ /^PR #[0-9]+: / { print substr($1, 1, 10) " " $2; exit }' "$out/log.tsv")"
                echo
                echo "Carried pull requests:"
                awk -F'\t' '$2 !~ /^PR #[0-9]+: / { exit } { print "- " $2 }' "$out/log.tsv" | tac
              } > "$out/RELEASE.md"
              # Basic ISO 8601 (no colons) so names stay URL-safe and sort by time.
              name="$PROJECT-$(date -u +%Y%m%dT%H%M%SZ)-${SHA:0:10}.zip"
              (cd "$out" && zip -q "$name" omp RELEASE.md && cp "$name" "$PROJECT-latest.zip")
              gh release view "$PROJECT" >/dev/null 2>&1 ||
                gh release create "$PROJECT" --target "$GITHUB_SHA" --latest=false --title "$PROJECT integration builds" \
                  --notes "Integration builds of $PROJECT, newest 10 kept; $PROJECT-latest.zip is a copy of the newest. Each zip holds the build and a RELEASE.md naming the commit, upstream base and carried pull requests."
              gh release upload "$PROJECT" "$out/$name"
              gh release upload "$PROJECT" "$out/$PROJECT-latest.zip" --clobber
              gh release view "$PROJECT" --json assets \
                --jq '[.assets[].name | select(startswith(env.PROJECT + "-") and endswith(".zip") and . != env.PROJECT + "-latest.zip")] | sort | reverse | .[10:][]' |
                while read -r old; do gh release delete-asset "$PROJECT" "$old" --yes; done
