name: omp integration build

# Dispatched by `integration build` (CI_REPO/CI_WORKFLOW in config/root--git--oh-my-pi.sh)
# with the integration head to build. The fork carries no workflow of its own: PR
# branches and the integration branch are rebuilt from upstream every round.
#
# `build` runs the config's BUILD_CMD/TEST_CMD (the test gate). The release
# binaries follow upstream's release jobs: every native addon (macOS included)
# is bazel-built on Linux, bun cross-compiles every binary on Linux, and each
# binary is smoke-tested on its own platform before publishing.
on:
   workflow_dispatch:
      inputs:
         repo:
            description: Fork holding the commit (owner/repo)
            required: true
            type: string
         sha:
            description: Integration commit to build (full sha)
            required: true
            type: string

run-name: build ${{ inputs.sha }}

# The build jobs run the fork's code, including carried third-party PRs, so they
# get a read-only token that is not persisted into the checkouts; only
# `publish`, which runs no fork code, can write releases. Cache saves use the
# runner's own cache token, not GITHUB_TOKEN. The fork's bazel-cache action only
# wires upstream's cluster remote cache, so these jobs add an actions/cache disk
# cache (see the natives job).
permissions: {}

jobs:
   build:
      runs-on: ubuntu-24.04
      timeout-minutes: 90
      permissions:
         contents: read
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
           with:
              repository: ${{ inputs.repo }}
              ref: ${{ inputs.sha }}
              persist-credentials: false
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
           with:
              path: ci
              persist-credentials: false
         - uses: ./.github/actions/bun-install
         # Bazel disk cache: see the natives job.
         - id: disk
           uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
           with:
              path: ~/.cache/omp-bazel-disk
              key: bazel-disk-v1-build-${{ hashFiles('Cargo.lock', 'MODULE.bazel.lock') }}
              restore-keys: bazel-disk-v1-build-
         - id: bazel
           uses: ./.github/actions/bazel-cache
         - name: Use the bazel disk cache
           shell: bash
           env:
              RC: ${{ steps.bazel.outputs.rc }}
           run: |
              echo "common --disk_cache=$HOME/.cache/omp-bazel-disk" >> "$RC"
              touch "$RUNNER_TEMP/bazel-start"
         - name: Build and test
           shell: bash
           env:
              OMP_BAZEL_RC: ${{ steps.bazel.outputs.rc }}
              # The host build defaults to cargo.
              OMP_NATIVE_BUILD_BACKEND: bazel
           run: |
              set -euo pipefail
              # Same file-descriptor floor upstream's bazel steps set.
              if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
              source ci/config/root--git--oh-my-pi.sh
              eval "$BUILD_CMD"
              eval "$TEST_CMD"
         - name: Prune unused bazel disk cache entries
           if: success() && steps.disk.outputs.cache-hit != 'true'
           shell: bash
           run: |
              find ~/.cache/omp-bazel-disk -type f ! -newer "$RUNNER_TEMP/bazel-start" -delete
              du -sh ~/.cache/omp-bazel-disk
         - if: success() && steps.disk.outputs.cache-hit != 'true'
           uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
           with:
              path: ~/.cache/omp-bazel-disk
              key: ${{ steps.disk.outputs.cache-primary-key }}

   # Every addon target, macOS included: upstream cross-compiles them all on Linux
   # (hermetic darwin and msvc toolchains in the fork's bazel config). One job per
   # target: all seven on one runner overrun two hours uncached.
   #
   # Each bazel job keeps a disk cache keyed by the lockfiles: a run on a cached
   # lockfile recompiles only pi_natives and saves nothing. A lockfile change starts
   # from the previous cache and, when green, saves a new one pruned to the entries
   # this run used (bazel refreshes an entry's mtime on every hit), so old
   # dependencies never accumulate. Only green runs save, so a failing PR build
   # never seeds the cache.
   natives:
      strategy:
         fail-fast: false
         matrix:
            target:
               - linux-x64-baseline
               - linux-x64-modern
               - linux-arm64
               - win32-x64-baseline
               - win32-arm64
               - darwin-x64-baseline
               - darwin-arm64
      runs-on: ubuntu-24.04
      timeout-minutes: 120
      permissions:
         contents: read
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
           with:
              repository: ${{ inputs.repo }}
              ref: ${{ inputs.sha }}
              persist-credentials: false
         - uses: ./.github/actions/bun-install
         - id: disk
           uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
           with:
              path: ~/.cache/omp-bazel-disk
              key: bazel-disk-v1-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'MODULE.bazel.lock') }}
              restore-keys: bazel-disk-v1-${{ matrix.target }}-
         - id: bazel
           uses: ./.github/actions/bazel-cache
         - name: Use the bazel disk cache
           shell: bash
           env:
              RC: ${{ steps.bazel.outputs.rc }}
           run: |
              echo "common --disk_cache=$HOME/.cache/omp-bazel-disk" >> "$RC"
              touch "$RUNNER_TEMP/bazel-start"
         - name: Build native addons
           shell: bash
           env:
              OMP_BAZEL_RC: ${{ steps.bazel.outputs.rc }}
           run: |
              set -euo pipefail
              if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
              bun scripts/bazel-natives.ts "${{ matrix.target }}" --dest packages/natives/native
         - name: Prune unused bazel disk cache entries
           if: success() && steps.disk.outputs.cache-hit != 'true'
           shell: bash
           run: |
              find ~/.cache/omp-bazel-disk -type f ! -newer "$RUNNER_TEMP/bazel-start" -delete
              du -sh ~/.cache/omp-bazel-disk
         - if: success() && steps.disk.outputs.cache-hit != 'true'
           uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
           with:
              path: ~/.cache/omp-bazel-disk
              key: ${{ steps.disk.outputs.cache-primary-key }}
         - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
           with:
              name: natives-${{ matrix.target }}
              path: packages/natives/native/*.node
              retention-days: 1
              if-no-files-found: error

   binaries:
      needs: natives
      strategy:
         fail-fast: false
         matrix:
            include:
               - { target: linux-x64, file: omp-linux-x64, out: omp }
               - { target: linux-arm64, file: omp-linux-arm64, out: omp }
               - { target: darwin-x64, file: omp-darwin-x64, out: omp }
               - { target: darwin-arm64, file: omp-darwin-arm64, out: omp }
               - { target: win32-x64, file: omp-windows-x64.exe, out: omp.exe }
               - { target: win32-arm64, file: omp-windows-arm64.exe, out: omp.exe }
      runs-on: ubuntu-24.04
      timeout-minutes: 30
      permissions:
         contents: read
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
           with:
              repository: ${{ inputs.repo }}
              ref: ${{ inputs.sha }}
              persist-credentials: false
         - uses: ./.github/actions/bun-install
         - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
           with:
              pattern: natives-*
              merge-multiple: true
              path: packages/natives/native
         - name: Build release binary
           shell: bash
           env:
              RELEASE_TARGETS: ${{ matrix.target }}
           run: |
              set -euo pipefail
              bun run ci:release:build-binaries
              # No Apple credentials here, so the script signs ad hoc (still runnable).
              if [[ "$RELEASE_TARGETS" == darwin-* ]]; then
                bash scripts/ci-macos-sign.sh "packages/coding-agent/binaries/${{ matrix.file }}"
              fi
              mkdir -p "$RUNNER_TEMP/out"
              mv "packages/coding-agent/binaries/${{ matrix.file }}" "$RUNNER_TEMP/out/${{ matrix.out }}"
         - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
           with:
              name: omp-${{ matrix.target }}
              path: ${{ runner.temp }}/out/${{ matrix.out }}
              retention-days: 7
              if-no-files-found: error

   # Each cross-compiled binary runs on its own platform before it is published.
   smoke:
      needs: binaries
      strategy:
         fail-fast: false
         matrix:
            include:
               - { target: linux-x64, os: ubuntu-24.04 }
               - { target: linux-arm64, os: ubuntu-24.04-arm }
               - { target: darwin-x64, os: macos-15-intel }
               - { target: darwin-arm64, os: macos-15 }
               - { target: win32-x64, os: windows-2025 }
               - { target: win32-arm64, os: windows-11-arm }
      runs-on: ${{ matrix.os }}
      timeout-minutes: 15
      permissions: {}
      steps:
         - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
           with:
              name: omp-${{ matrix.target }}
              path: bin
         - name: Smoke release binary
           if: runner.os != 'Windows'
           shell: bash
           run: |
              set -euo pipefail
              chmod +x bin/omp
              if [ "$RUNNER_OS" = macOS ]; then codesign --verify --strict --verbose=2 bin/omp; fi
              runtime_dir="$(mktemp -d)"
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" bin/omp --version
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" bin/omp --smoke-test
         - name: Smoke release binary (Windows)
           if: runner.os == 'Windows'
           shell: pwsh
           run: |
              $runtimeDir = Join-Path $env:RUNNER_TEMP "omp-smoke"
              $env:HOME = Join-Path $runtimeDir "home"
              $env:USERPROFILE = $env:HOME
              $env:LOCALAPPDATA = Join-Path $runtimeDir "local"
              $env:XDG_DATA_HOME = Join-Path $runtimeDir "xdg"
              New-Item -ItemType Directory -Force -Path $env:HOME, $env:LOCALAPPDATA, $env:XDG_DATA_HOME | Out-Null
              & "bin/omp.exe" --version
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              & "bin/omp.exe" --smoke-test
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

   publish:
      needs: [build, smoke]
      permissions:
         contents: write
      uses: ./.github/workflows/publish.yml
      with:
         repo: ${{ inputs.repo }}
         sha: ${{ inputs.sha }}
         project: oh-my-pi
         artifact: omp
         targets: linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64 win32-arm64
         executables: omp
         description: "omp binary for {target}. macOS builds are ad-hoc signed, not notarized: after a browser download, run `xattr -d com.apple.quarantine omp` once."
