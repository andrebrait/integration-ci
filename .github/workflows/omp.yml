name: omp integration build

# Dispatched by `integration build` (CI_REPO/CI_WORKFLOW in config/root--git--oh-my-pi.sh)
# with the integration head to build. The fork carries no workflow of its own: PR
# branches and the integration branch are rebuilt from upstream every round.
on:
   workflow_dispatch:
      inputs:
         repo:
            description: Fork holding the commit (owner/repo)
            required: true
            type: string
         sha:
            description: Integration commit to build (full sha)
            required: true
            type: string

run-name: build ${{ inputs.sha }}

# The build job runs the fork's code, including carried third-party PRs, so it
# gets no write access to this repository's contents; only `publish`, which
# never runs fork code, can write releases.
permissions: {}

jobs:
   build:
      runs-on: ubuntu-24.04
      timeout-minutes: 90
      # Read-only token, and not persisted into the checkouts, so the fork's
      # build and test code cannot use it. Cache saves use the runner's own
      # cache token, not GITHUB_TOKEN.
      permissions:
         contents: read
      steps:
         - uses: actions/checkout@v4
           with:
              repository: ${{ inputs.repo }}
              ref: ${{ inputs.sha }}
              persist-credentials: false
         - uses: actions/checkout@v4
           with:
              path: ci
              persist-credentials: false
         - uses: ./.github/actions/bun-install
         - id: bazel
           uses: ./.github/actions/bazel-cache
           with:
              scope: linux
         - name: Build and test
           shell: bash
           env:
              OMP_BAZEL_RC: ${{ steps.bazel.outputs.rc }}
              # The host build defaults to cargo, which ignores the bazel disk cache.
              OMP_NATIVE_BUILD_BACKEND: bazel
           run: |
              set -euo pipefail
              # Same file-descriptor floor upstream's bazel steps set.
              if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
              source ci/config/root--git--oh-my-pi.sh
              eval "$BUILD_CMD"
              eval "$TEST_CMD"
         # Only green runs seed the cache, so a failing (possibly hostile) PR
         # build never persists what it wrote into ~/.cache/omp-bazel-*.
         - name: Save bazel disk cache
           if: success() && steps.bazel.outputs.save-needed == 'true'
           continue-on-error: true
           uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              # Must mirror the restore path list in the fork's bazel-cache action.
              path: |
                 ~/.cache/omp-bazel-disk
                 ~/.cache/omp-bazel-repo
              key: ${{ steps.bazel.outputs.cache-key }}
         - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: omp
              path: packages/coding-agent/dist/omp
              retention-days: 7
              if-no-files-found: error
   publish:
      needs: build
      permissions:
         contents: write
      uses: ./.github/workflows/publish.yml
      with:
         repo: ${{ inputs.repo }}
         sha: ${{ inputs.sha }}
         project: oh-my-pi
         artifact: omp
         executables: omp
         description: Linux x64 omp binary. Requires glibc 2.39 or newer and a CPU with AVX2 (only the modern native addon is built).
