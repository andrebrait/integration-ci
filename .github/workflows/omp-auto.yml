name: omp auto-integration

# Rebuilds the integration branch onto each new upstream omp release, builds it
# with omp.yml, and publishes it as a release on the fork. A round that fails
# gets one repair attempt by an omp agent; the repaired candidate is built by a
# second run of this workflow (`candidate` input). A failed repair, or a repaired
# candidate that still fails, opens an issue here.
# Design: docs/specs/2026-11-11-omp-auto-integration-design.md.
#
# Trust: jobs that run fork code or the agent get no push credential. Only
# candidate, repair-push and release hold OMP_FORK_TOKEN, and they run no fork
# code. Nothing is released before omp.yml builds and tests the exact commit.
on:
   schedule:
      - cron: "17 * * * *"
   workflow_dispatch:
      inputs:
         tag:
            description: Upstream release tag (default the latest release)
            required: false
            type: string
            default: ""
         force:
            description: Run even if the fork already has a release for this tag
            required: false
            type: boolean
            default: false
         candidate:
            description: "Internal: repaired candidate commit to build"
            required: false
            type: string
            default: ""
         repair_run:
            description: "Internal: run that holds the repair artifact"
            required: false
            type: string
            default: ""

run-name: omp auto-integration ${{ inputs.tag || 'latest' }}${{ inputs.candidate && ' (repaired)' || '' }}

permissions: {}

env:
   FORK: andrebrait/oh-my-pi
   UPSTREAM: can1357/oh-my-pi

jobs:
   detect:
      runs-on: ubuntu-24.04
      timeout-minutes: 5
      permissions:
         actions: read
      outputs:
         tag: ${{ steps.detect.outputs.tag }}
      steps:
         - id: detect
           env:
              GH_TOKEN: ${{ github.token }}
              TAG: ${{ inputs.tag }}
              FORCE: ${{ inputs.force }}
              CANDIDATE: ${{ inputs.candidate }}
           run: |
              set -euo pipefail
              [ -n "$TAG" ] || TAG="$(gh release view -R "$UPSTREAM" --json tagName --jq .tagName)"
              if [ -z "$CANDIDATE" ]; then
                # One round at a time. A repaired candidate always runs; a scheduled
                # round that finds another one running waits for the next hour.
                busy="$(gh run list -R "$GITHUB_REPOSITORY" --workflow omp-auto.yml --limit 20 --json databaseId,status \
                  --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and .status != \"completed\")] | length")"
                if [ "$busy" != 0 ] && [ "$GITHUB_EVENT_NAME" = schedule ]; then
                  echo "Another omp auto-integration run is active; skipping."
                  exit 0
                fi
                if [ "$FORCE" != true ] && gh release list -R "$FORK" --limit 100 --json tagName --jq '.[].tagName' | grep -q "^$TAG-int\."; then
                  echo "$FORK already has a release for $TAG; skipping."
                  exit 0
                fi
              fi
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"

   # Runs the fork's code (FORMAT_CMD) with no secrets.
   rebuild:
      needs: detect
      if: needs.detect.outputs.tag != '' && inputs.candidate == ''
      runs-on: ubuntu-24.04
      timeout-minutes: 60
      permissions:
         contents: read
      env:
         GH_TOKEN: ${{ github.token }}
         INTEGRATION_SLUG: root--git--oh-my-pi
         INTEGRATION_CONFIG_DIR: ${{ github.workspace }}/ci/config
         INTEGRATION_CACHE_DIR: /tmp/integration-cache
         INTEGRATION_BASE: ${{ needs.detect.outputs.tag }}
         INTEGRATION_PR_AUTHOR: andrebrait
         INTEGRATION_HEAD_PREFIX: refs/rebased
         INTEGRATION_WT: /tmp/integration
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
           with:
              repository: ${{ env.FORK }}
              fetch-depth: 0
              persist-credentials: false
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
           with:
              path: ci
              persist-credentials: false
         - uses: ./.github/actions/bun-install
         - name: Prepare the integration worktree
           run: |
              set -euo pipefail
              git remote add upstream "https://github.com/$UPSTREAM.git"
              git config user.name "omp auto-integration"
              git config user.email "omp-auto@users.noreply.github.com"
              git branch -f integration origin/integration
              git worktree add -q "$INTEGRATION_WT" integration
              # FORMAT_CMD (gen:compat) loads the native addon: use the release's prebuilt one.
              npm pack -q --pack-destination "$RUNNER_TEMP" "@oh-my-pi/pi-natives-linux-x64@${INTEGRATION_BASE#v}" >/dev/null
              tar xzf "$RUNNER_TEMP"/oh-my-pi-pi-natives-linux-x64-*.tgz -C "$RUNNER_TEMP"
              mkdir -p "$INTEGRATION_WT/packages/natives/native"
              cp "$RUNNER_TEMP"/package/*.node "$INTEGRATION_WT/packages/natives/native/"
         - name: Rebuild onto ${{ needs.detect.outputs.tag }}
           run: |
              set -o pipefail
              mkdir -p "$RUNNER_TEMP/round"
              if ci/integration rebuild "$GITHUB_WORKSPACE" 2>&1 | tee "$RUNNER_TEMP/rebuild.log"; then
                exit 0
              fi
              jq -n --arg tag "$INTEGRATION_BASE" --arg log "$(tail -n 200 "$RUNNER_TEMP/rebuild.log")" \
                '{step: "rebuild", tag: $tag, log: $log}' > "$RUNNER_TEMP/round/failure.json"
              exit 1
         - name: Bundle the rebuilt branch
           run: |
              set -euo pipefail
              git bundle create "$RUNNER_TEMP/round/integration.bundle" integration "^$INTEGRATION_BASE"
              jq -n --arg tag "$INTEGRATION_BASE" --arg sha "$(git rev-parse integration)" '{tag: $tag, sha: $sha}' > "$RUNNER_TEMP/round/round.json"
         - if: always()
           uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
           with:
              name: round-rebuild
              path: ${{ runner.temp }}/round
              retention-days: 7
              if-no-files-found: ignore

   # Publishes the rebuilt branch as the fork's integration-candidate; runs no fork code.
   candidate:
      needs: [detect, rebuild]
      runs-on: ubuntu-24.04
      timeout-minutes: 30
      permissions: {}
      outputs:
         sha: ${{ steps.push.outputs.sha }}
      steps:
         - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
           with:
              name: round-rebuild
              path: round
         - id: push
           env:
              TOKEN: ${{ secrets.OMP_FORK_TOKEN }}
              TAG: ${{ needs.detect.outputs.tag }}
           run: |
              set -euo pipefail
              round="$PWD/round"
              git init -q fork && cd fork
              # The fork and upstream serve every object a blobless clone lacks.
              git remote add origin "https://x-access-token:$TOKEN@github.com/$FORK.git"
              git remote add upstream "https://github.com/$UPSTREAM.git"
              for r in origin upstream; do git config "remote.$r.promisor" true; git config "remote.$r.partialclonefilter" blob:none; done
              git fetch -q --filter=blob:none --no-tags upstream "refs/tags/$TAG:refs/tags/$TAG"
              git bundle verify -q "$round/integration.bundle"
              git fetch -q "$round/integration.bundle" refs/heads/integration:refs/heads/integration
              sha="$(git rev-parse integration)"
              [ "$sha" = "$(jq -r .sha "$round/round.json")" ]
              git push -q --force origin "integration:refs/heads/integration-candidate"
              echo "sha=$sha" >> "$GITHUB_OUTPUT"

   build:
      needs: [detect, candidate]
      if: always() && needs.detect.outputs.tag != '' && (needs.candidate.result == 'success' || inputs.candidate != '')
      permissions:
         contents: write
      uses: ./.github/workflows/omp.yml
      with:
         repo: andrebrait/oh-my-pi
         sha: ${{ needs.candidate.outputs.sha || inputs.candidate }}

   # Runs the fork's code and the agent; holds the model API keys and no push credential.
   repair:
      needs: [detect, rebuild, candidate, build]
      if: >-
         always() && needs.detect.outputs.tag != '' && inputs.candidate == '' &&
         (needs.rebuild.result == 'failure' || needs.build.result == 'failure')
      runs-on: ubuntu-24.04
      timeout-minutes: 330
      permissions:
         contents: read
         actions: read
      env:
         GH_TOKEN: ${{ github.token }}
         INTEGRATION_SLUG: root--git--oh-my-pi
         INTEGRATION_CONFIG_DIR: ${{ github.workspace }}/ci/config
         INTEGRATION_CACHE_DIR: /tmp/integration-cache
         INTEGRATION_BASE: ${{ needs.detect.outputs.tag }}
         INTEGRATION_PR_AUTHOR: andrebrait
         INTEGRATION_HEAD_PREFIX: refs/rebased
         INTEGRATION_WT: /tmp/integration
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
           with:
              repository: ${{ env.FORK }}
              fetch-depth: 0
              persist-credentials: false
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
           with:
              path: ci
              persist-credentials: false
         - uses: ./.github/actions/bun-install
         # Bazel disk cache, as omp.yml's build job: BUILD_CMD compiles the natives.
         - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
           with:
              path: ~/.cache/omp-bazel-disk
              key: bazel-disk-v1-build-${{ hashFiles('Cargo.lock', 'MODULE.bazel.lock') }}
              restore-keys: bazel-disk-v1-build-
         - id: bazel
           uses: ./.github/actions/bazel-cache
         - name: Prepare the integration worktree and the agent
           env:
              RC: ${{ steps.bazel.outputs.rc }}
              TAG: ${{ needs.detect.outputs.tag }}
           run: |
              set -euo pipefail
              echo "common --disk_cache=$HOME/.cache/omp-bazel-disk" >> "$RC"
              git remote add upstream "https://github.com/$UPSTREAM.git"
              git config user.name "omp auto-integration"
              git config user.email "omp-auto@users.noreply.github.com"
              git branch -f integration origin/integration
              git worktree add -q "$INTEGRATION_WT" integration
              # Prebuilt addon for FORMAT_CMD until the agent runs BUILD_CMD.
              npm pack -q --pack-destination "$RUNNER_TEMP" "@oh-my-pi/pi-natives-linux-x64@${TAG#v}" >/dev/null
              tar xzf "$RUNNER_TEMP"/oh-my-pi-pi-natives-linux-x64-*.tgz -C "$RUNNER_TEMP"
              mkdir -p "$INTEGRATION_WT/packages/natives/native"
              cp "$RUNNER_TEMP"/package/*.node "$INTEGRATION_WT/packages/natives/native/"
              # The agent is upstream's own release binary, never the code under repair.
              mkdir -p "$RUNNER_TEMP/agent"
              gh release download "$TAG" -R "$UPSTREAM" -D "$RUNNER_TEMP/agent" -p omp-linux-x64 -p SHA256SUMS.txt
              (cd "$RUNNER_TEMP/agent" && grep -E '[ *]omp-linux-x64$' SHA256SUMS.txt | sha256sum -c -)
              chmod +x "$RUNNER_TEMP/agent/omp-linux-x64"
         - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
           continue-on-error: true
           with:
              name: round-rebuild
              path: ${{ runner.temp }}/round
         - name: Describe the failure
           env:
              TAG: ${{ needs.detect.outputs.tag }}
           run: |
              set -euo pipefail
              f="$RUNNER_TEMP/failure.json"
              if [ -f "$RUNNER_TEMP/round/failure.json" ]; then
                cp "$RUNNER_TEMP/round/failure.json" "$f"
              else
                # The candidate failed omp.yml: hand the agent the failed jobs' log tails.
                log=""
                for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --paginate \
                  --jq '.jobs[] | select(.conclusion == "failure") | .id'); do
                  log+="$(gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$id/logs" | tail -n 150)"$'\n'
                done
                jq -n --arg tag "$TAG" --arg log "$log" '{step: "build", tag: $tag, log: $log}' > "$f"
              fi
              cat "$f"
         - name: Repair
           env:
              OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
              ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
              OMP_BAZEL_RC: ${{ steps.bazel.outputs.rc }}
              OMP_NATIVE_BUILD_BACKEND: bazel
           run: |
              set -uo pipefail
              ulimit -Sn 65536 || true
              omp="$RUNNER_TEMP/agent/omp-linux-x64"
              prompt="$(cat ci/prompts/omp-repair.md; printf '\n## failure.json\n\n```json\n'; cat "$RUNNER_TEMP/failure.json"; printf '\n```\n')"
              state() { git -C "$INTEGRATION_WT" rev-parse HEAD; git -C "$INTEGRATION_WT" status --porcelain; }
              before="$(state)"
              run_agent() { # model thinking
                echo "repair model: $1 ($2)" | tee -a "$RUNNER_TEMP/agent.log"
                "$omp" -p --no-session --model "$1" --thinking "$2" --approval-mode yolo "$prompt" 2>&1 | tee -a "$RUNNER_TEMP/agent.log"
              }
              run_agent openai/gpt-6-luna high
              status=$?
              # Fall back only when Luna never started working: a provider error and nothing changed.
              if [ "$status" != 0 ] && [ "$(state)" = "$before" ] &&
                grep -qiE 'insufficient_quota|exceeded your current quota|billing|credit balance|invalid[_ ]api[_ ]key|incorrect api key|authentication|unauthorized|\b(401|402|429)\b' "$RUNNER_TEMP/agent.log"; then
                run_agent anthropic/claude-haiku-5-5 medium
                status=$?
              fi
              exit "$status"
         - name: Verify and bundle the repair
           env:
              TAG: ${{ needs.detect.outputs.tag }}
           run: |
              set -euo pipefail
              out="$RUNNER_TEMP/repair"
              mkdir -p "$out"
              # The saved fixups, resolutions and rebased heads must rebuild the round on their own.
              git -C "$INTEGRATION_WT" checkout -q -B integration origin/integration
              ci/integration rebuild "$GITHUB_WORKSPACE"
              [ -z "$(git -C "$INTEGRATION_WT" status --porcelain)" ]
              rebased="$(git for-each-ref --format='%(refname)' refs/rebased/)"
              # shellcheck disable=SC2086
              git bundle create "$out/integration.bundle" integration $rebased "^$TAG"
              : > "$out/rebased.tsv"
              for ref in $rebased; do
                b="${ref#refs/rebased/}"
                printf '%s\t%s\t%s\n' "$b" "$(git rev-parse "origin/$b")" "$(git rev-parse "$ref")" >> "$out/rebased.tsv"
              done
              git -C ci add -N config/fixups
              git -C ci diff -- config/fixups > "$out/fixups.patch"
              jq -n --arg tag "$TAG" --arg sha "$(git rev-parse integration)" '{tag: $tag, sha: $sha}' > "$out/round.json"
         - if: always()
           run: |
              out="$RUNNER_TEMP/repair"
              mkdir -p "$out"
              cp "$RUNNER_TEMP/agent.log" "$out/" 2>/dev/null || true
              cp "$RUNNER_TEMP/repair-notes.md" "$out/" 2>/dev/null || echo "The repair agent wrote no notes." > "$out/repair-notes.md"
         - if: always()
           uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
           with:
              name: repair
              path: ${{ runner.temp }}/repair
              retention-days: 30

   # Publishes the repaired candidate and starts the run that builds it; runs no fork code.
   repair-push:
      needs: [detect, repair]
      runs-on: ubuntu-24.04
      timeout-minutes: 30
      permissions:
         actions: write
      steps:
         - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
           with:
              name: repair
              path: repair
         - env:
              TOKEN: ${{ secrets.OMP_FORK_TOKEN }}
              GH_TOKEN: ${{ github.token }}
              TAG: ${{ needs.detect.outputs.tag }}
           run: |
              set -euo pipefail
              repair="$PWD/repair"
              git init -q fork && cd fork
              git remote add origin "https://x-access-token:$TOKEN@github.com/$FORK.git"
              git remote add upstream "https://github.com/$UPSTREAM.git"
              for r in origin upstream; do git config "remote.$r.promisor" true; git config "remote.$r.partialclonefilter" blob:none; done
              git fetch -q --filter=blob:none --no-tags upstream "refs/tags/$TAG:refs/tags/$TAG"
              git bundle verify -q "$repair/integration.bundle"
              git fetch -q "$repair/integration.bundle" refs/heads/integration:refs/heads/integration 'refs/rebased/*:refs/rebased/*'
              sha="$(git rev-parse integration)"
              [ "$sha" = "$(jq -r .sha "$repair/round.json")" ]
              # Rebased PR branches wait under integration-rebased/ until the build is green.
              git push -q --force origin "integration:refs/heads/integration-candidate" 'refs/rebased/*:refs/heads/integration-rebased/*'
              gh workflow run omp-auto.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
                -f tag="$TAG" -f candidate="$sha" -f repair_run="$GITHUB_RUN_ID" -f force=true

   # Runs no fork code: attaches the built binaries to a release on the fork.
   release:
      needs: [detect, candidate, build]
      if: always() && needs.build.result == 'success'
      runs-on: ubuntu-24.04
      timeout-minutes: 30
      permissions:
         actions: read
      outputs:
         tag: ${{ steps.release.outputs.tag }}
      steps:
         - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
           with:
              pattern: omp-*
              path: bin
         - if: inputs.repair_run != ''
           uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
           with:
              name: repair
              path: repair
              run-id: ${{ inputs.repair_run }}
              github-token: ${{ github.token }}
         - id: release
           env:
              GH_TOKEN: ${{ secrets.OMP_FORK_TOKEN }}
              READ_TOKEN: ${{ github.token }}
              TAG: ${{ needs.detect.outputs.tag }}
              SHA: ${{ inputs.candidate || needs.candidate.outputs.sha }}
           run: |
              set -euo pipefail
              rel="$TAG-int.${SHA:0:7}"
              mkdir -p out
              # Upstream's asset names, so consumers verify them the same way.
              for pair in linux-x64:omp-linux-x64 linux-arm64:omp-linux-arm64 darwin-x64:omp-darwin-x64 \
                darwin-arm64:omp-darwin-arm64 win32-x64:omp-windows-x64.exe win32-arm64:omp-windows-arm64.exe; do
                src="bin/omp-${pair%%:*}"
                cp "$src/$(ls "$src")" "out/${pair#*:}"
              done
              chmod +x out/omp-linux-* out/omp-darwin-*
              (cd out && sha256sum -- * > SHA256SUMS.txt)
              # Rebased PR branches move only if nobody pushed them since the round started.
              skipped=""
              if [ -s repair/rebased.tsv ]; then
                while IFS=$'\t' read -r branch old new; do
                  cur="$(gh api "repos/$FORK/git/ref/heads/$branch" --jq .object.sha)"
                  if [ "$cur" = "$old" ]; then
                    gh api -X PATCH "repos/$FORK/git/refs/heads/$branch" -f sha="$new" -F force=true >/dev/null
                    echo "Rebased $branch onto $TAG: $new"
                  else
                    skipped+="- \`$branch\` moved during the round; its rebase onto $TAG was not pushed."$'\n'
                  fi
                  gh api -X DELETE "repos/$FORK/git/refs/heads/integration-rebased/$branch" >/dev/null || true
                done < repair/rebased.tsv
              fi
              {
                GH_TOKEN="$READ_TOKEN" gh release view "$TAG" -R "$UPSTREAM" --json body --jq .body
                printf '\n## Carried patches\n\n'
                # The branch is the release plus `PR ...:` squashes, newest first.
                gh api "repos/$FORK/commits?sha=$SHA&per_page=100" --jq '.[].commit.message | split("\n")[0]' |
                  awk '!/^PR / { exit } { print }' | tac |
                  sed -E 's~^PR #([0-9]+): (.*)~- [#\1](https://github.com/can1357/oh-my-pi/pull/\1): \2~; s~^PR ([^ #]+)#([0-9]+): (.*)~- [\1#\2](https://github.com/\1/pull/\2): \3~'
                [ -z "$skipped" ] || printf '\n%s' "$skipped"
              } > notes.md
              gh release create "$rel" -R "$FORK" --target "$SHA" --title "$rel" --notes-file notes.md --latest out/*
              gh api -X PATCH "repos/$FORK/git/refs/heads/integration-release" -f sha="$SHA" -F force=true >/dev/null ||
                gh api -X POST "repos/$FORK/git/refs" -f ref=refs/heads/integration-release -f sha="$SHA" >/dev/null
              # Keep the newest 10 integration releases.
              gh release list -R "$FORK" --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[].tagName' |
                grep -- '-int\.' | tail -n +11 | while read -r old; do gh release delete "$old" -R "$FORK" --cleanup-tag --yes; done
              echo "tag=$rel" >> "$GITHUB_OUTPUT"

   # Keeps a repair's fixups for later rounds, once its candidate is green.
   fixups:
      needs: [detect, release]
      if: always() && needs.release.result == 'success' && inputs.repair_run != ''
      runs-on: ubuntu-24.04
      timeout-minutes: 10
      permissions:
         contents: write
         actions: read
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
         - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
           with:
              name: repair
              path: ${{ runner.temp }}/repair
              run-id: ${{ inputs.repair_run }}
              github-token: ${{ github.token }}
         - env:
              TAG: ${{ needs.detect.outputs.tag }}
           run: |
              set -euo pipefail
              patch="$RUNNER_TEMP/repair/fixups.patch"
              [ -s "$patch" ] || { echo "The repair changed no fixups."; exit 0; }
              git apply --index "$patch"
              git -c user.name="omp auto-integration" -c user.email="omp-auto@users.noreply.github.com" \
                commit -q -m "fixups(omp): $TAG repair" -m "From run https://github.com/$GITHUB_REPOSITORY/actions/runs/${{ inputs.repair_run }}."
              git push -q origin HEAD:main

   escalate:
      needs: [detect, rebuild, candidate, build, repair, repair-push, release]
      if: >-
         always() && needs.detect.outputs.tag != '' && (
            needs.repair.result == 'failure' || needs.repair-push.result == 'failure' ||
            needs.release.result == 'failure' || needs.candidate.result == 'failure' ||
            (inputs.candidate != '' && needs.build.result == 'failure'))
      runs-on: ubuntu-24.04
      timeout-minutes: 10
      permissions:
         issues: write
         actions: read
      steps:
         - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
           continue-on-error: true
           with:
              name: repair
              path: repair
              run-id: ${{ inputs.repair_run || github.run_id }}
              github-token: ${{ github.token }}
         - env:
              GH_TOKEN: ${{ github.token }}
              TAG: ${{ needs.detect.outputs.tag }}
              RESULTS: >-
                 rebuild=${{ needs.rebuild.result }} candidate=${{ needs.candidate.result }}
                 build=${{ needs.build.result }} repair=${{ needs.repair.result }}
                 repair-push=${{ needs.repair-push.result }} release=${{ needs.release.result }}
           run: |
              set -euo pipefail
              title="omp auto-integration failed for $TAG"
              {
                echo "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
                echo
                echo "Jobs: \`$RESULTS\`"
                echo
                echo "Finish this round locally with \`integration rebuild\` (base \`$TAG\`), or fix the cause and re-run the workflow with \`force\`."
                if [ -f repair/repair-notes.md ]; then printf '\n## Repair notes\n\n'; cat repair/repair-notes.md; fi
              } > body.md
              gh label create omp-auto -R "$GITHUB_REPOSITORY" --color B60205 --description "omp auto-integration failures" --force >/dev/null
              n="$(gh issue list -R "$GITHUB_REPOSITORY" --label omp-auto --state open --search "in:title \"$title\"" --json number,title \
                --jq "[.[] | select(.title == \"$title\")][0].number // empty")"
              if [ -n "$n" ]; then
                gh issue comment "$n" -R "$GITHUB_REPOSITORY" --body-file body.md
              else
                gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --label omp-auto --body-file body.md
              fi
