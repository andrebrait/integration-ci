name: zz runner probe
on: workflow_dispatch
permissions: {}
jobs:
   probe:
      strategy:
         fail-fast: false
         matrix:
            os: [xcode-27, macos-26, macos-15, windows-11-arm, ubuntu-24.04-arm]
      runs-on: ${{ matrix.os }}
      timeout-minutes: 5
      steps:
         - shell: bash
           run: |
              uname -a
              if command -v sw_vers >/dev/null; then sw_vers; xcodebuild -version; swift --version 2>&1 | head -1; xcrun --show-sdk-version; fi
