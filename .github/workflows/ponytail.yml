name: ponytail integration build

# Dispatched by `integration build` (CI_REPO/CI_WORKFLOW in config/root--git--ponytail.sh) with the
# integration head to build. Build and test commands come from that config.
on:
   workflow_dispatch:
      inputs:
         repo:
            description: Fork holding the commit (owner/repo)
            required: true
            type: string
         sha:
            description: Integration commit to build (full sha)
            required: true
            type: string

run-name: build ${{ inputs.sha }}

# The build job runs the fork's code, including carried PRs, so it gets a
# read-only token that is not persisted into the checkouts; only the publish
# job, which runs no fork code, can write releases.
permissions: {}

jobs:
   build:
      runs-on: ubuntu-24.04
      timeout-minutes: 20
      permissions:
         contents: read
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
           with:
              repository: ${{ inputs.repo }}
              ref: ${{ inputs.sha }}
              persist-credentials: false
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
           with:
              path: ci
              persist-credentials: false
         - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
           with:
              node-version: "22"
         - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
         - name: Build, test and pack
           shell: bash
           env:
              OUT: ${{ runner.temp }}/out
           run: |
              set -euo pipefail
              mkdir -p "$OUT"
              source ci/config/root--git--ponytail.sh
              eval "$BUILD_CMD"
              if [ -n "${TEST_CMD:-}" ]; then eval "$TEST_CMD"; fi
              npm pack --silent --pack-destination "$OUT"
         - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
           with:
              name: ponytail
              path: ${{ runner.temp }}/out
              retention-days: 7
              if-no-files-found: error
   publish:
      needs: build
      permissions:
         contents: write
      uses: ./.github/workflows/publish.yml
      with:
         repo: ${{ inputs.repo }}
         sha: ${{ inputs.sha }}
         project: ponytail
         artifact: ponytail
         description: npm pack of @dietrichgebert/ponytail.
